services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: scrutio
      POSTGRES_PASSWORD: scrutio
      POSTGRES_DB: scrutio
    ports:
      - '5432:5432'
    volumes:
      - scrutio-postgres:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scrutio -d scrutio']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  scrutio-postgres:
