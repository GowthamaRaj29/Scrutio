services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: scrutio
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_DB: scrutio
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - scrutio-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scrutio -d scrutio']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  scrutio-postgres:
